<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-label="GraphOps architecture: Triage and Historian agents write findings to a FalkorDB graph in parallel; the Commander reads them and records a traceable decision; resolved incidents become memory for the next session.">
  <defs>
    <style>
      text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #d8deea; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .muted { fill: #7d8aa5; }
      .h { font-weight: 700; font-size: 17px; letter-spacing: 1.5px; }
      .t { font-size: 13px; }
      .s { font-size: 11px; }
      .flow { fill: none; stroke-width: 2.2; stroke-dasharray: 7 7; animation: dash 0.9s linear infinite; }
      .flow.slow { animation-duration: 1.6s; }
      @keyframes dash { to { stroke-dashoffset: -14; } }
      .glow { animation: glow 3s ease-in-out infinite; }
      @keyframes glow { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
      .blink { animation: blink 2.4s ease-in-out infinite; }
      @keyframes blink { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f141d"/><stop offset="1" stop-color="#0a0d13"/>
    </linearGradient>
    <linearGradient id="falkor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1709"/><stop offset="1" stop-color="#14100c"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
    <marker id="ah-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4fa3ff"/></marker>
    <marker id="ah-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b67cff"/></marker>
    <marker id="ah-o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff8a3d"/></marker>
    <marker id="ah-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3ddc97"/></marker>
    <marker id="ah-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6680"/></marker>

    <path id="p-in-tri" d="M470,107 C380,107 250,110 245,146"/>
    <path id="p-in-his" d="M730,107 C820,107 950,110 955,146"/>
    <path id="p-tri-db" d="M245,322 C245,350 380,345 410,378"/>
    <path id="p-his-db" d="M955,322 C955,350 820,345 790,378"/>
    <path id="p-db-cmd" d="M600,532 L600,572"/>
    <path id="p-cmd-dec" d="M600,646 L600,676"/>
    <path id="p-loop" d="M872,712 C1100,712 1170,640 1170,470 C1170,300 1160,236 1124,236"/>
    <path id="p-mcp" d="M252,455 L300,455"/>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="779" rx="18" fill="url(#bg)" stroke="#232b3d"/>

  <!-- title -->
  <text x="34" y="44" font-size="20" font-weight="700"><tspan fill="#ff8a3d">◈</tspan> GraphOps</text>
  <text x="168" y="44" class="t muted">three agents · one FalkorDB graph as shared state, memory and audit trail</text>

  <!-- incident input -->
  <rect x="470" y="84" width="260" height="46" rx="23" fill="#1a1f2b" stroke="#ff5c6c"/>
  <circle cx="496" cy="107" r="6" fill="#ff5c6c" class="blink"/>
  <text x="512" y="112" class="t">“Checkout is throwing 500s”</text>

  <!-- input -> agents -->
  <path d="M470,107 C380,107 250,110 245,146" class="flow" stroke="#4fa3ff" marker-end="url(#ah-b)"/>
  <path d="M730,107 C820,107 950,110 955,146" class="flow" stroke="#b67cff" marker-end="url(#ah-p)"/>
  <circle r="4.5" fill="#4fa3ff"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#p-in-tri"/></animateMotion></circle>
  <circle r="4.5" fill="#b67cff"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#p-in-his"/></animateMotion></circle>

  <!-- parallel badge -->
  <rect x="540" y="214" width="120" height="30" rx="15" fill="#141a26" stroke="#2c3550"/>
  <text x="600" y="234" text-anchor="middle" class="s muted" letter-spacing="1">⇉ IN PARALLEL</text>

  <!-- TRIAGE -->
  <rect x="80" y="150" width="330" height="172" rx="14" fill="#4fa3ff" opacity=".18" filter="url(#soft)" class="glow"/>
  <rect x="80" y="150" width="330" height="172" rx="14" fill="#121a29" stroke="#4fa3ff" stroke-width="1.5"/>
  <text x="102" y="182" class="h" fill="#4fa3ff" style="fill:#4fa3ff">TRIAGE</text>
  <text x="196" y="182" class="s muted">acts on connected data</text>
  <text x="102" y="212" class="t mono">probable_root_cause</text><text x="270" y="212" class="s muted">DEPENDS_ON*0..5</text>
  <text x="102" y="236" class="t mono">blast_radius</text><text x="214" y="236" class="s muted">→ revenue at risk</text>
  <text x="102" y="260" class="t mono">recent_changes · dependency_path</text>
  <text x="102" y="284" class="t mono">PageRank · betweenness · CDLP</text>
  <text x="102" y="306" class="s muted">root cause, suspect deploy, blast radius</text>

  <!-- HISTORIAN -->
  <rect x="790" y="150" width="330" height="172" rx="14" fill="#b67cff" opacity=".18" filter="url(#soft)" class="glow" style="animation-delay:1.5s"/>
  <rect x="790" y="150" width="330" height="172" rx="14" fill="#18142a" stroke="#b67cff" stroke-width="1.5"/>
  <text x="812" y="182" class="h" style="fill:#b67cff">HISTORIAN</text>
  <text x="935" y="182" class="s muted">memory</text>
  <text x="812" y="212" class="t mono">similar_incidents</text><text x="960" y="212" class="s muted">episodic</text>
  <text x="812" y="236" class="t mono">runbooks_for</text><text x="925" y="236" class="s muted">procedural</text>
  <text x="812" y="260" class="t mono">decisions_and_docs · facts</text><text x="1030" y="260" class="s muted">semantic</text>
  <text x="812" y="284" class="t mono">who_knows</text><text x="900" y="284" class="s muted">company brain</text>
  <text x="812" y="306" class="s muted">precedents, runbooks, ADRs, experts</text>

  <!-- agents -> graph (concurrent writes) -->
  <path d="M245,322 C245,350 380,345 410,378" class="flow" stroke="#4fa3ff" marker-end="url(#ah-b)"/>
  <path d="M955,322 C955,350 820,345 790,378" class="flow" stroke="#b67cff" marker-end="url(#ah-p)"/>
  <circle r="4.5" fill="#4fa3ff"><animateMotion dur="1.6s" begin="0.4s" repeatCount="indefinite"><mpath href="#p-tri-db"/></animateMotion></circle>
  <circle r="4.5" fill="#b67cff"><animateMotion dur="1.6s" begin="0.9s" repeatCount="indefinite"><mpath href="#p-his-db"/></animateMotion></circle>
  <text x="250" y="352" class="s mono muted">record_finding</text>
  <text x="868" y="352" class="s mono muted">record_finding</text>

  <!-- FALKORDB PANEL -->
  <rect x="300" y="380" width="600" height="152" rx="16" fill="#ff8a3d" opacity=".22" filter="url(#soft)" class="glow"/>
  <rect x="300" y="380" width="600" height="152" rx="16" fill="url(#falkor)" stroke="#ff8a3d" stroke-width="1.8"/>
  <text x="322" y="406" class="t" font-weight="700" style="fill:#ff8a3d">FalkorDB</text>
  <text x="392" y="406" class="s mono muted">graph per tenant · graphops_acme</text>
  <text x="878" y="406" class="s muted" text-anchor="end">shared state between agents</text>

  <!-- mini graph edges -->
  <g stroke="#5a6680" stroke-width="1.4" fill="none">
    <path d="M392,465 L500,434" marker-end="url(#ah-m)"/>
    <path d="M392,465 L500,465" marker-end="url(#ah-m)"/>
    <path d="M392,465 L500,496" marker-end="url(#ah-m)"/>
    <path d="M532,434 L640,430" marker-end="url(#ah-m)" stroke="#6b4fa0" stroke-dasharray="4 4"/>
    <path d="M532,465 L640,465" marker-end="url(#ah-m)" stroke="#6b4fa0" stroke-dasharray="4 4"/>
    <path d="M532,496 L640,500" marker-end="url(#ah-m)" stroke="#6b4fa0" stroke-dasharray="4 4"/>
    <path d="M532,434 L640,465" stroke="#6b4fa0" stroke-dasharray="4 4" opacity=".6"/>
  </g>
  <text x="428" y="446" class="s mono muted" transform="rotate(-15 428 446)">HAS_FINDING</text>
  <text x="560" y="456" class="s mono muted">EVIDENCE</text>

  <!-- mini graph nodes -->
  <rect x="368" y="453" width="24" height="24" rx="4" fill="#ff8a3d"/>
  <text x="380" y="500" class="s" text-anchor="middle">Investigation</text>
  <g fill="#b67cff">
    <circle cx="516" cy="434" r="8"><animate attributeName="r" values="7;10;7" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="516" cy="465" r="8"><animate attributeName="r" values="7;10;7" dur="2.2s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="516" cy="496" r="8"><animate attributeName="r" values="7;10;7" dur="2.2s" begin="1.4s" repeatCount="indefinite"/></circle>
  </g>
  <text x="516" y="522" class="s" text-anchor="middle">Findings</text>
  <circle cx="652" cy="430" r="10" fill="#4fa3ff" stroke="#ff5c6c" stroke-width="3"/>
  <text x="670" y="434" class="s mono">payments-db</text>
  <rect x="643" y="456" width="18" height="18" rx="3" fill="#ff8a3d"/>
  <text x="670" y="469" class="s mono">DEP-981</text>
  <rect x="643" y="491" width="18" height="18" rx="3" fill="#c678dd"/>
  <text x="670" y="504" class="s mono">INC-2041</text>
  <text x="760" y="434" class="s muted">Service</text>
  <text x="760" y="469" class="s muted">Deploy</text>
  <text x="760" y="504" class="s muted">Incident</text>
  <text x="878" y="526" class="s muted" text-anchor="end">every claim → its evidence</text>

  <!-- MCP side box -->
  <rect x="60" y="420" width="192" height="70" rx="12" fill="#121722" stroke="#3a4560"/>
  <text x="78" y="448" class="t" font-weight="600">MCP server</text>
  <text x="78" y="470" class="s muted">26 graph tools for Claude, Cursor…</text>
  <path d="M252,455 L300,455" class="flow slow" stroke="#7d8aa5" marker-end="url(#ah-m)"/>

  <!-- graph -> commander -->
  <path d="M600,532 L600,572" class="flow" stroke="#ff8a3d" marker-end="url(#ah-o)"/>
  <circle r="4.5" fill="#ff8a3d"><animateMotion dur="1.2s" repeatCount="indefinite"><mpath href="#p-db-cmd"/></animateMotion></circle>
  <text x="612" y="558" class="s mono muted">read_investigation</text>

  <!-- COMMANDER -->
  <rect x="420" y="574" width="360" height="72" rx="14" fill="#ff8a3d" opacity=".18" filter="url(#soft)" class="glow" style="animation-delay:.8s"/>
  <rect x="420" y="574" width="360" height="72" rx="14" fill="#1d150d" stroke="#ff8a3d" stroke-width="1.5"/>
  <text x="442" y="604" class="h" style="fill:#ff8a3d">COMMANDER</text>
  <text x="600" y="604" class="s muted">decides and pages</text>
  <text x="442" y="630" class="t mono">who_to_page → record_decision</text>

  <!-- commander -> decision -->
  <path d="M600,646 L600,676" class="flow" stroke="#ffc24b" marker-end="url(#ah-o)"/>

  <!-- DECISION -->
  <rect x="328" y="680" width="544" height="64" rx="12" fill="#1a1710" stroke="#ffc24b"/>
  <rect x="344" y="696" width="44" height="20" rx="4" fill="#ff5c6c"/>
  <text x="366" y="711" class="s" text-anchor="middle" font-weight="700" style="fill:#fff">SEV1</text>
  <text x="398" y="711" class="t" font-weight="600">Decision</text>
  <text x="466" y="711" class="s mono muted">-[:BASED_ON]→ Findings · ROOT_CAUSE · SUSPECTS · PAGES</text>
  <text x="344" y="733" class="s muted">click “Why?” to walk Decision → Findings → evidence nodes and the Cypher behind them</text>

  <!-- MEMORY LOOP -->
  <path d="M872,712 C1100,712 1170,640 1170,470 C1170,300 1160,236 1124,236" class="flow slow" stroke="#3ddc97" marker-end="url(#ah-g)"/>
  <circle r="5" fill="#3ddc97"><animateMotion dur="3.6s" repeatCount="indefinite"><mpath href="#p-loop"/></animateMotion></circle>
  <circle r="5" fill="#3ddc97" opacity=".6"><animateMotion dur="3.6s" begin="1.8s" repeatCount="indefinite"><mpath href="#p-loop"/></animateMotion></circle>
  <rect x="935" y="560" width="210" height="92" rx="12" fill="#0f1d18" stroke="#3ddc97"/>
  <text x="952" y="586" class="t" font-weight="700" style="fill:#3ddc97">Mark resolved &amp; remember</text>
  <text x="952" y="608" class="s mono">→ (:Incident) memory</text>
  <text x="952" y="626" class="s mono">→ runbook.success_count++</text>
  <text x="952" y="644" class="s muted">recalled in the next session</text>
</svg>
