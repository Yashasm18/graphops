# One-command setup: FalkorDB + GraphOps.
#   docker compose up --build                      (scripted agents, no key needed)
#   GEMINI_API_KEY=... docker compose up --build   (Gemini agents)
# Without a key the agents run their scripted graph playbooks.
services:
  falkordb:
    image: falkordb/falkordb:latest
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "6379:6379"   # FalkorDB
      - "3001:3000"   # FalkorDB Browser UI
  graphops:
    build: .
    depends_on:
      falkordb:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-gemini-3.8-flash,gemini-3.5-flash-lite,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3.1-flash-lite,gemini-3-flash-preview}
      GEMINI_THINKING: low
